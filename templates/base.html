<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {% block title %}Finacle{% endblock %}
    </title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark top-navbar shadow-sm">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold" href="{{ url_for('dashboard.dashboard') }}">

            <i class="bi bi-wallet2"></i>

            Finacle

        </a>

        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a class="nav-link"
                       href="{{ url_for('dashboard.dashboard') }}">

                        <i class="bi bi-grid"></i>

                        Dashboard

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="{{ url_for('transactions.transactions') }}">

                        <i class="bi bi-cash-stack"></i>

                        Transactions

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="#">

                        <i class="bi bi-robot"></i>

                        AI

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="#">

                        <i class="bi bi-file-earmark-pdf"></i>

                        Reports

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="#">

                        <i class="bi bi-gear"></i>

                        Settings

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link text-warning"
                       href="{{ url_for('auth.logout') }}">

                        <i class="bi bi-box-arrow-right"></i>

                        Logout

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>

<div class="container py-4">

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="alert alert-{{ category }}">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}

    {% block content %}

    {% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
